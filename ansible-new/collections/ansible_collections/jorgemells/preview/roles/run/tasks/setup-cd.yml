---
- name: Setup CD state
  when: cd_state == "present"
  block:
    - name: Configure GitHub repository webhook
      community.general.github_webhook:
        user: "jorge-mells"
        repository: "jorge-mells/movie_reservation_again"
        url: "https://{{ run_full_domain }}/hooks/deploy"
        secret: "{{ run_webhook_secret }}"
        content_type: "json"
        events:
          - "package"
        active: true
        state: "present"
        token: "{{ lookup('ansible.builtin.pipe', 'gh auth token') }}" # NOTE: heighten security(the token is too broad!!)
      delegate_to: localhost
      run_once: true
      when: run_setup_github_cd | default(false)

    - name: Configure fake webhook test script
      ansible.builtin.template:
        src: templates/fake-cd.sh.j2
        dest: "{{ playbook_dir }}/fake-cd.sh"
        owner: "{{ lookup('env', 'USER') }}"
        group: "{{ lookup('env', 'USER') }}"
        mode: "0755"
      delegate_to: localhost
      run_once: true
      when: run_setup_fake_cd | default(true)

- name: Cleanup fake webhook script
  ansible.builtin.file:
    path: "{{ playbook_dir }}/fake-cd.sh"
    state: absent
  when: cd_state == "absent"
