- name: Prepare container instances
  hosts: all
  gather_facts: false
  vars:
    ansible_user: root
  tasks:
    - name: Install required packages
      ansible.builtin.dnf:
        name: "{{ required_packages }}"
        state: present
      when: required_packages is defined

    - name: Create ansible user
      ansible.builtin.user:
        name: ansible
        state: present
        create_home: true
        home: /home/ansible

    - name: Install sudo
      ansible.builtin.dnf:
        name: sudo
        state: present

    - name: Grant ansible user passwordless sudo
      ansible.builtin.copy:
        content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/ansible
        mode: "0440"
