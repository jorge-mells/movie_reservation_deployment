run_main_tasks: true
run_dns_tasks: true
run_setup_cd: true
run_cleanup_tasks: false


run_compose_dir: ~
# the path to the compose directory on the remote host
run_compose_dest: "{{ ansible_facts['user_dir'] }}/compose"
# the environment for regular compose
run_env: {}
# the full domain name of the web service
run_full_domain: ~
# relative path to env file in compose directory
run_compose_env_file: ~

run_ansible_user: "{{ ansible_env.USER }}"
run_ansible_user_homedir: "{{ ansible_env.HOME }}"
run_webhook_dir: "{{ run_ansible_user_homedir }}/webhook"
run_webhook_secret: ~

run_dns: "fake"
run_cd_type: "fake"

run_github_user: ~
run_github_repo: ~

