---
- name: DNS and Certificate tasks
  when: run_dns_tasks
  block:
    - name: Simulate fake dns
      ansible.builtin.include_tasks: fake-dns.yml
      when: run_dns == "fake"
      vars:
        dns_state: present

    - name: Setup Hetzner DNS
      ansible.builtin.include_tasks: hetzner-dns.yml
      when: run_dns == "hetzner"
      vars:
        dns_state: present

- name: Main tasks
  when: run_main_tasks
  block:
    - name: Install docker
      ansible.builtin.import_tasks: install-docker-centos.yml

    - name: Import docker compose project
      ansible.builtin.import_tasks: docker-compose.yml

- name: Setup CD
  when: run_setup_cd
  block:
    - name: Install adnanh/webhook
      ansible.builtin.include_tasks: install-webhook.yml

    - name: Setup adnanh/webhook
      ansible.builtin.include_tasks: setup-webhook.yml

    - name: Setup CD
      ansible.builtin.include_tasks: setup-cd.yml
      vars:
        cd_state: present

- name: DNS cleanup tasks
  when: run_cleanup_tasks
  block:
    - name: Cleanup simulated dns
      ansible.builtin.include_tasks: fake-dns.yml
      when: run_dns == "fake"
      vars:
        dns_state: absent

    - name: Cleanup Hetzner dns
      ansible.builtin.include_tasks: hetzner-dns.yml
      when: run_dns == "hetzner"
      vars:
        dns_state: absent

    - name: Cleanup CD-related stuff
      ansible.builtin.include_tasks: setup-cd.yml
      vars:
        cd_state: absent
