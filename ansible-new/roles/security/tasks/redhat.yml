---
- name: Upgrade Server
  ansible.builtin.dnf:
    name: "*"
    state: latest
  when: security_upgrade_to_latest
  become: true
  tags:
    - skip_ansible_lint # disable package installs should not use latest error.
    - molecule-idempotence-notest

- name: Install dnf-automatic for security updates
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present
  become: true

- name: Configure dnf-automatic to apply security updates automatically
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: '0644'
  loop:
    - { option: 'upgrade_type', value: 'security' }
    - { option: 'apply_updates', value: 'yes' }
  become: true

- name: Enable and start the dnf-automatic timer
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    enabled: true
    state: started
  become: true

- name: Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts["distribution"] == "CentOS"
  become: true
  tags:
    - molecule-idempotence-notest

- name: Install Fail2ban
  ansible.builtin.dnf:
    name: fail2ban
    state: present
  become: true

- name: Remove EPEL
  ansible.builtin.package:
    name: epel-release
    state: absent
  become: true
  tags:
    - molecule-idempotence-notest

- name: Configure Fail2ban
  ansible.builtin.copy:
    src: "{{ role_path }}/files/jail.local"
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  become: true # BUG: your tests currently don't catch this

- name: Start and enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  become: true

- name: Install firewall
  ansible.builtin.dnf:
    name: firewalld
    state: present
  become: true

- name: Configure firewall
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
  loop:
    - http
    - https
    - ssh
  become: true

- name: Start and enable firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true
  become: true
