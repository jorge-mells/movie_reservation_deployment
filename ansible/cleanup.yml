---
- name: Cleanup playbook
  hosts: terraform
  pre_tasks:
    - name: Set host vars from server config
      vars:
        _server: "{{ servers[groups['terraform'].index(inventory_hostname)] }}"
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ _server | dict2items | rejectattr('key', 'in', ['run_env', 'dynamic_env']) | list }}"

    - name: Override run vars for cleanup
      ansible.builtin.set_fact:
        run_cleanup_tasks: true
        run_main_tasks: false
        run_dns_tasks: false
        run_setup_cd: false

  roles:
    - role: run
      vars:
        run_domain_name: "{{ domain_name | mandatory }}"
        run_github_token: "{{ lookup('ansible.builtin.pipe', 'gh auth token') }}"
        run_dns: "hetzner"
        run_hetzner_api_token: "{{ lookup('pipe', 'bw get item hcloud_token | jq -r .notes') }}"
