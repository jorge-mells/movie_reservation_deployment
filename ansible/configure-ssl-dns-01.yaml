---
# NOTE: it probably makes better sense to use the http-01 method since that's way more straightforward(no need for api keys). yep. this is practically useless.
# It's not so straightforward since wildcard certs can only be done with dns-01.

# WARN: add some kind of monitoring to your certificates(maybe auditing so that when it is used you're informed)
- name: Load uncommitted configuration and secrets
  ansible.builtin.include_vars:
    file: "{{ item }}"
  loop:
    - vars/main.yaml
    - vars/secrets.yaml
  delegate_to: localhost
  run_once: true

- name: Run ACME role for wildcard certificate
  import_role:
    name: telekom_mms.acme.acme
  delegate_to: localhost
  run_once: true
  vars:
    acme_challenge_provider: hetzner
    acme_use_live_directory: true
    acme_conf_dir: "/etc/ssl/letsencrypt"
    acme_domain:
      email_address: "{{ acme_account_email }}"
      certificate_name: "wildcard.jorgemells.com"
      zone: "jorgemells.com"
      subject_alt_name:
        - "*.jorgemells.com"
        - "jorgemells.com"

- name: Stage Let's Encrypt certificates locally
  ansible.builtin.copy:
    src: /etc/ssl/letsencrypt/
    dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.certs/letsencrypt/"
    owner: "{{ lookup('ansible.builtin.env', 'USER') }}"
    group: "{{ lookup('ansible.builtin.env', 'USER') }}"
    mode: preserve
    force: true
    remote_src: true
  become: true
  delegate_to: localhost
  run_once: true


- name: Distribute certificates to remote web servers
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.env', 'HOME') }}/.certs/letsencrypt/"
    dest: /etc/ssl/letsencrypt/
    owner: root
    group: root
    mode: preserve
    force: true
  become: true
