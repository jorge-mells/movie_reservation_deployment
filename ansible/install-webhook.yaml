- name: Set architecture mapping for webhook binary
  ansible.builtin.set_fact:
    webhook_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"

- name: Download and install webhook v2.8.3
  ansible.builtin.get_url:
    url: "https://github.com/adnanh/webhook/releases/download/2.8.3/webhook-linux-{{ webhook_arch }}.tar.gz"
    dest: "/tmp/webhook.tar.gz"
    mode: "0644"

- name: Extract webhook binary to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/webhook.tar.gz"
    dest: "/usr/local/bin/"
    include: "webhook-linux-{{ webhook_arch }}/webhook"
    remote_src: true
    extra_opts: ["--strip-components=1"]
  become: true

- name: Create webhook systemd service file from template
  ansible.builtin.template:
    src: "templates/webhook.service.j2"
    dest: "/etc/systemd/system/webhook.service"
    owner: "root"
    group: "root"
    mode: "0644"
  become: true
