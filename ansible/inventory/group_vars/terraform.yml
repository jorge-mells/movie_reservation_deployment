---
servers:
  0:
    enable_node_exporter: true
    dynamic_env: [UID, VIRTUAL_HOST, SECRET_KEY, DB_PASSWORD, DB_ROOT_PASSWORD, LETSENCRYPT_EMAIL]
    run_compose_app: movie-reservation
    run_subdomains: [api, www]
    run_cd_type: github
    run_cleanup_tasks: false
    run_main_tasks: true
    run_dns_tasks: true
    run_setup_cd: true
    run_deploy_targets_varname: DEPLOY_HOSTS
    run_ssh_private_key_varname: SSH_DEPLOY_PRIVATE_KEY
    run_deploy_pubkey_varname: SSH_DEPLOY_PUBLIC_KEY
    run_deploy_scriptname: deploy.sh
    run_deploy_relative_dir: deploy
    run_env:
      VIRTUAL_PORT: "8000"
      DB_NAME: prod
      DB_USER: movie_reservation

  1:
    dynamic_env: [UID, GF_SECURITY_ADMIN_PASSWORD, NODE_EXPORTER_PASSWORD, NODE_EXPORTER_HOST, VIRTUAL_HOST, VIRTUAL_PORT, LETSENCRYPT_EMAIL]
    run_cleanup_tasks: false
    run_main_tasks: true
    run_dns_tasks: true
    run_setup_cd: false
    run_compose_app: monitoring
    run_subdomains: [monitoring]
    run_cd_type: ~ # to prevent cd plays running at all
    run_env:
      VIRTUAL_PORT: "3000"
