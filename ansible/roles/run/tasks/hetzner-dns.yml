---
- name: DNS A record - Create/Remove for domain
  community.dns.hetzner_dns_record:
    state: "{{ dns_state }}"
    zone_name: "{{ run_domain_name }}"
    prefix: "{{ item }}"
    type: A
    value: "{{ ansible_host }}"
    ttl: 300
    hetzner_api_token: "{{ run_hetzner_api_token }}"
  delegate_to: localhost
  loop: "{{ run_subdomains }}"
