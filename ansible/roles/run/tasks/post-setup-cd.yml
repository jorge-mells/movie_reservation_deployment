---
- name: Compute and update deploy targets
  run_once: true
  delegate_to: localhost
  block:
    - name: Compute deploy targets list
      vars:
        _host_vars: "{{ hostvars[loop_host] }}"
        _cd_hosts: >-
          {{ ansible_play_hosts
             | map('extract', hostvars)
             | selectattr('run_setup_cd', 'defined')
             | selectattr('run_setup_cd')
             | map(attribute='inventory_hostname')
             | list }}
      ansible.builtin.set_fact:
        run_updated_targets_fact: >-
          {{ (run_updated_targets_fact | default([])) +
             [{'user': _host_vars.ansible_user, 'ip': _host_vars.ansible_host}] }}
      loop: "{{ _cd_hosts }}"
      loop_control:
        loop_var: loop_host

    - name: Update deploy targets variable
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ run_github_user }}/{{ run_github_repo }}/actions/variables/{{ run_deploy_targets_varname }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ run_github_token }}"
          Accept: "application/vnd.github+json"
        body_format: json
        body:
          name: "{{ run_deploy_targets_varname }}"
          value: "{{ run_updated_targets_fact | to_json }}"
        status_code: [200, 204]
