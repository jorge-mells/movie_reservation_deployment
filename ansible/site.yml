---
- name: Main playbook
  hosts: all
  pre_tasks:
    - name: Add first VM to webservers
      delegate_to: localhost
      run_once: true # noqa: run-once[task]
      ansible.builtin.add_host:
        name: "{{ groups['all'][0] }}"
        groups: webservers

    - name: Set full domain
      ansible.builtin.set_fact:
        domain_name: "{{ hostvars[groups['webservers'][0]]['domain_name'] }}"
        # NOTE: refactor this since a host can have several domains each needing dns
        # Attach subdomain names to hosts lest all hosts have the same subdomain
        full_domain: "{{ subdomain_name }}.{{ domain_name | default('example.com') }}"

    - name: Allow unprivileged processes to bind to port 80
      become: true
      ansible.posix.sysctl:
        name: net.ipv4.ip_unprivileged_port_start
        value: "80"
        sysctl_file: /etc/sysctl.d/99-unprivileged-ports.conf
        state: present
        sysctl_set: true
        reload: true

  roles:
    - role: security
    - role: run
      vars:
        run_full_domain: "{{ full_domain }}"
        run_domain_name: "{{ domain_name }}"
        run_dns: "hetzner"
        run_cd_type: "github"
        run_hetzner_api_token: "{{ lookup('pipe', 'bw get item hcloud_token | jq -r .notes') }}"
        run_compose_dir: "{{ playbook_dir }}/../compose"
        run_compose_env_file: ".env.prod"
        run_github_token: "{{ lookup('ansible.builtin.pipe', 'gh auth token') }}"
        # NOTE: get from github deploy.yml workflow
        run_deploy_targets_varname: "DEPLOY_HOSTS"
        run_ssh_private_key_varname: "SSH_DEPLOY_PRIVATE_KEY"
        run_deploy_pubkey_varname: "SSH_DEPLOY_PUBLIC_KEY"
        run_deploy_scriptname: "deploy.sh"
        run_deploy_relative_dir: "deploy"
        # NOTE: end
        run_env:
          VIRTUAL_PORT: "8000"
          UID: "{{ ansible_facts['user_uid'] }}"
          LETSENCRYPT_EMAIL: "{{ letsencrypt_email | mandatory }}"
          VIRTUAL_HOST: "{{ full_domain }}"
          DB_ROOT_PASSWORD: "{{ lookup('pipe', 'pass show ansible/db-root-password') }}"
          DB_NAME: "prod"
          DB_USER: movie_reservation
          DB_PASSWORD: "{{ lookup('pipe', 'pass show ansible/db-password') }}"
          SECRET_KEY: "{{ lookup('pipe', 'openssl rand -hex 32') }}"
