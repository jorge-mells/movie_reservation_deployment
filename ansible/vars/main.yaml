acme_account_email: "{{ vault_acme_account_email }}"
acme_force_renewal: false

mysql_root_password: "{{ vault_mysql_root_password }}"
mysql_hide_passwords: true
mysql_bind_address: '127.0.0.1' # security
mysql_disable_log_bin: true # preserve disk space
mysql_databases:
  - name: production
mysql_users:
  - name: production
    password: "{{ vault_mysql_user_password }}"
    priv: "production.*:ALL"

