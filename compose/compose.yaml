# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  reverseproxy:
    image: nginxproxy/nginx-proxy:1.11@sha256:39c263cc518ef0a336faddbeeb1e4d736920526f32addf3747ebe331d2d7b361
    labels:
      com.github.nginx-proxy.nginx: "true"
    extra_hosts:
      - "host-gateway:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /run/user/${UID}/podman/podman.sock:/tmp/docker.sock:roz
      - certs:/etc/nginx/certs:z
      - vhost:/etc/nginx/vhost.d:z
      - html:/usr/share/nginx/html:z
    restart: unless-stopped
    environment:
      UID: ${UID:?User ID of docker host is required}
    networks:
      - external

  acme-companion:
    image: nginxproxy/acme-companion
    volumes_from:
      - reverseproxy
    volumes:
      - /run/user/${UID}/podman/podman.sock:/var/run/docker.sock:roz
      - acme:/etc/acme.sh
    environment:
      UID: ${UID:?User ID of docker host is required}
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:?Please provide letsencrypt email}
      NGINX_PROXY_CONTAINER: reverseproxy
    restart: unless-stopped
    networks:
      - external

  db:
    image: mysql:26.7.0@sha256:893418c8a7a34c60d2d961cc30ef136095da141478562ed2101ae3f5faba9c3f
    restart: always
    volumes:
      - "dbdata:/var/lib/mysql"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Please provide the root password for the initial root setup}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h localhost -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database

  movie_reservation:
    image: ghcr.io/jorge-mells/movie_reservation_again@${IMAGE_TAG}
    expose:
      - "${VIRTUAL_PORT:?Please provide service port}"
    depends_on:
      db:
        condition: service_healthy
      reverseproxy:
        condition: service_started
    pre_start:
      - command: ["./scripts/setup-db.sh"]
        image: mysql:26.7.0@sha256:893418c8a7a34c60d2d961cc30ef136095da141478562ed2101ae3f5faba9c3f
        volumes:
          - ./scripts/setup-db.sh:/scripts/setup-db.sh:z
      - command: ["./scripts/setup-webhooks.sh"] # automate cd
        image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
        volumes:
          - ./scripts/setup-webhooks.sh:/scripts/setup-webhooks.sh:z
          - vhost:/vhost.d
    environment:
      IMAGE_TAG: ${IMAGE_TAG:?Please provide the movie_reservation image tag as a sha256 hash(see .env.prod)}
      DB_HOST: ${DB_HOST:?See .env.prod}
      DB_PORT: ${DB_PORT:?See .env.prod}
      DB_NAME: ${DB_NAME:?Please specify db name}
      DB_USER: ${DB_USER:?Please specify db user}
      DB_PASSWORD: ${DB_PASSWORD:?Please provide the db password}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Please provide the root password for the initial root setup}
      DATABASE_URL: "mysql+pymysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
      SECRET_KEY: ${SECRET_KEY:?Please provide the secret key for the app. See app for details}
      # proxy env vars
      WEBHOOK_SERVICE_NAME: ${WEBHOOK_SERVICE_NAME:?See .env.prod}
      WEBHOOK_SERVICE_PORT: ${WEBHOOK_SERVICE_PORT:?See .env.prod}
      VIRTUAL_HOST: ${VIRTUAL_HOST:?Please provide service domain name}
      VIRTUAL_PORT: ${VIRTUAL_PORT:?Please provide service port}
      LETSENCRYPT_HOST: ${VIRTUAL_HOST:?Please provide service domain name} # NOTE: remove this to stop acme
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import urllib.request; urllib.request.urlopen("http://localhost:8000/health")''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database
      - external

volumes:
  dbdata:
  vhost:
  certs:
  html:
  acme:

networks:
  database:
  external:
